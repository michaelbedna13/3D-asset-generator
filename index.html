<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#232323" />
    <meta name="description" content="Turn a picture or a 3D model into a point cloud or a shape raster and export it as PNG, SVG, GIF or MP4." />
    <title>RASTR Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23232323'/%3E%3Cg fill='%23e4e4e4'%3E%3Crect x='3' y='3' width='4' height='4' rx='.8'/%3E%3Crect x='9' y='9' width='4' height='4' rx='.8'/%3E%3Ccircle cx='11' cy='5' r='1.4'/%3E%3Ccircle cx='5' cy='11' r='1.4'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2" width="5" height="5" rx="1" />
            <rect x="9" y="9" width="5" height="5" rx="1" />
            <circle cx="11.5" cy="4.5" r="1.7" />
            <circle cx="4.5" cy="11.5" r="1.7" />
          </svg>
          <h1>RASTR Studio</h1>
        </div>
        <div class="looks" id="looks"></div>
        <div class="topbar-end">
          <span class="stats" id="stats"></span>
          <div class="history" id="history"></div>
        </div>
      </header>

      <aside class="rail" aria-label="Source">
        <div class="rail-open">
          <button type="button" class="btn" id="open"></button>
          <p class="note">or drop a picture or a 3D model anywhere</p>
        </div>
        <section class="rail-section" id="opened" aria-labelledby="rail-opened" hidden>
          <h2 id="rail-opened">Opened</h2>
          <div class="tiles" id="opened-pictures"></div>
          <div class="object-list" id="opened-models"></div>
        </section>
        <section class="rail-section" aria-labelledby="rail-pictures">
          <h2 id="rail-pictures">Sample pictures</h2>
          <div class="tiles" id="pictures"></div>
        </section>
        <section class="rail-section" aria-labelledby="rail-objects">
          <h2 id="rail-objects">3D objects</h2>
          <div class="object-list" id="objects"></div>
        </section>
      </aside>

      <main class="stage">
        <div class="viewport" id="viewport">
          <canvas id="view" tabindex="0" aria-label="Preview. Drag to orbit, scroll or pinch to zoom."></canvas>
          <div class="drop" id="drop" hidden><span>Drop to open</span></div>
          <div class="progress" id="progress" hidden>
            <div class="progress-card" role="status" aria-live="polite">
              <span id="progress-label">Working</span>
              <div class="bar"><i id="progress-bar"></i></div>
              <button type="button" class="btn" id="progress-cancel">Cancel</button>
            </div>
          </div>
          <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="canvasbar" id="canvasbar"></div>
      </main>

      <aside class="panel" id="panel" aria-label="Settings"></aside>
    </div>

    <input type="file" id="file-model" hidden multiple />
    <input type="file" id="file-preset" hidden accept=".json,application/json" />
    <input type="file" id="file-icon" hidden accept="image/*,.svg" />
    <input type="file" id="file-depth" hidden accept="image/*" />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
